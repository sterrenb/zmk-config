# Central half only.
#
# The shared keymap's MOUSE layer binds &mkp, and ZMK only compiles
# behavior_mouse_key_press.c when ZMK_POINTING is set:
#
#   config ZMK_BEHAVIOR_MOUSE_KEY_PRESS
#       depends on DT_HAS_ZMK_BEHAVIOR_MOUSE_KEY_PRESS_ENABLED && ZMK_POINTING
#
# Scoped to the left half rather than corne.conf because ZMK guards keymap.c,
# hid.c and every behavior source behind
#   if ((NOT CONFIG_ZMK_SPLIT) OR CONFIG_ZMK_SPLIT_ROLE_CENTRAL)
# so the right half never compiles the keymap, never references &mkp, and would
# only pull in the Zephyr input subsystem for nothing.
#
# Note: this adds a Mouse collection (report ID 0x03) to the HID report
# descriptor, so the Corne advertises as a composite keyboard+mouse. Nothing
# ever sends a mouse report on this board — the MOUSE layer is unreachable
# without a trackpad. See docs/multi-keyboard-plan.md §5.3.
CONFIG_ZMK_POINTING=y
