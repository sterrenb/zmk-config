# Enable pointing to support &mkp in the shared keymap. The keymap runs on the
# split central, so this is what the standalone build needs; in dongle mode the
# left half is a peripheral and config/corne_dongle.conf carries it instead.
CONFIG_ZMK_POINTING=y

# Enable eager debouncing. Kept per-half rather than in corne.conf -- see the
# comment there.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
