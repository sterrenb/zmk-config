CONFIG_ZMK_KEYBOARD_NAME="Toucan"

# Match the Corne's radio and debounce preferences.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# The shield definitions default deep sleep to 60 minutes; override to match
# the Corne's 30.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Regular ZMK idle timing defaults to 30s, which drops the trackpad to its
# low-power state (1.7mA vs 2.9mA active) well before most pauses in use,
# costing a 300ms wake-up lag on the next touch. Raised to match the
# trackpad's own timeout-lp1 override in toucan_right.overlay (5 min), so
# both thresholds clear together instead of the trackpad repeatedly
# suspending and waking mid-session. Trade-off: the trackpad now spends most
# of an active session at the higher 2.9mA draw instead of 1.7mA.
CONFIG_ZMK_IDLE_TIMEOUT=300000
