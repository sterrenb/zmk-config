# Shared by every Corne build. ZMK falls back from a shield name to its
# underscore-trimmed prefixes (app/keymap-module/modules/modules.cmake), so
# `corne_left`, `corne_right` and `corne_dongle` all pick this file up.
#
# That fallback is why the kscan debounce settings live in corne_left.conf and
# corne_right.conf instead: CONFIG_ZMK_KSCAN_DEBOUNCE_* sit under
# `if ZMK_KSCAN_GPIO_DRIVER`, the dongle has only a mock kscan, and Zephyr turns
# "assigned but not applied" into a build error.
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# Sleep after 15 minutes of inactivity
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
