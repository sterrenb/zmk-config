draw_config:
  outer_pad_w: 0
  outer_pad_h: 10

  append_colon_to_layer_header: false

  combo_w: 20
  combo_h: 20

  inner_pad_w: 1.5
  inner_pad_h: 1.5

  split_gap: 100

  svg_extra_style: |
    @font-face {
      font-family: 'QuinqueFive';
      src: url('data:font/woff2;base64,') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    svg.keymap {
      --color--red: rgb(255, 100, 80);
      --color--red-mild: rgb(200, 100, 100);

      --color--grey: rgb(100, 100, 100);
      --color--grey-mild: rgb(30, 30, 30);


      font-family: system-ui, sans-serif;
    }

    svg.keymap a {
      pointer-events: none;
    }

    /* Hide capitalize_i combo (index 2) to prevent drawing line across split */
    .combopos-2 {
        display: none;
    }

    /* The base layer's label is deliberately left visible: its display-name is
       KEYMAP_VERSION (config/shared/version.dtsi), so the diagram states which
       version it documents. release.yml attaches this SVG and a PNG of it to
       every release, where that stamp is the whole point -- do not hide it
       again without giving the release assets another way to identify
       themselves. It lands in the gutter between the two base-layer combos. */

    .combo.shifted {
      translate: -6px 1px;
    }

    .trans {
      opacity: 0.75;
    }

    /* Layer activators. keymap-drawer marks every key that must be HELD to be on
       the layer, and because mark_alternate_layer_activators stays off (default)
       the meaning is unambiguous: ALL marked keys are held at once. That is what
       makes Media's two marked thumbs read as the tri-layer combination rather
       than "either one". Dashed outline so it is not mistaken for the red accent
       keys or the blue combo boxes. */
    rect.held {
      stroke: var(--color--red);
      stroke-width: 2;
    }

    .keypos-0 rect.key,
    .keypos-11 rect.key {
      fill: var(--color--red);
      stroke: var(--color--red-mild);
    }

    .keypos-24 rect.key,
    .keypos-35 rect.key {
      fill: var(--color--grey);
      stroke: var(--color--grey-mild);
    }

    text.label {
      font-family: 'QuinqueFive', monospace;
      font-weight: normal;
      text-anchor: middle;
      fill: var(--strong, #1f2328);
      stroke: var(--bg, #ffffff);
      stroke-width: 3px;
      stroke-linejoin: round;
      paint-order: stroke fill;
      translate: 420px 100px;
      font-size: 14px;
    }

    .hold {
        opacity: 0.75;
    }

    /* The -16px nudge is only for the modifier GLYPHS on the home row, which
       keymap-drawer emits at x="-6". Text hold legends -- the "Num" layer name on
       the thumb -- are emitted at x="0" with text-anchor: middle, so they are
       already centred; shifting them just pushes them into the bottom-left. */
    use.hold {
        translate: -16px 0px;
    }

    .key.shifted {
        translate: 16px 2px;
    }

    /* The bluetooth keys were combos until the Media layer gained real keys for
       them; these rules shrank the legend to fit a 20x20 combo box. On a full
       key the glyph should just be a normal centred tap legend, so only the
       profile number in the corner needs nudging. */
    .bluetooth.shifted {
      translate: 14px 3px;
    }

    use[href="#mdi:comma"] {
      transform: scale(0.35);
    }

    use[href="#material:arrow_circle_down"],
    use[href="#material:arrow_circle_up"] {
      transform: scale(1.8);
    }
parse_config:
  sticky_label: $$mdi:gesture-tap-hold$$
  trans_legend:
    tap: $$mdi:transfer$$
    type: trans
  raw_binding_map:
    "&caps_word": $$mdi:format-letter-case-upper$$
    "&capitalize_i": "Cap I"
    # keymap-drawer has no built-in handling for &mkp; without these the Mouse
    # layer renders the literal binding text.
    "&mkp LCLK": $$mdi:mouse-left-click-outline$$
    "&mkp RCLK": $$mdi:mouse-right-click-outline$$
    "&mkp MCLK": $$mdi:mouse$$
    # Also unhandled by default, so they render as literal binding text.
    "&sys_reset": $$mdi:restart$$
    "&bootloader": $$mdi:usb-flash-drive-outline$$
    # Hold-to-confirm wrappers. Without these the drawer would resolve the
    # hold-tap to tap="" (the &none) and put the icon in the small hold slot,
    # leaving the key looking empty. Matched on the behaviour name, so the
    # "0 0" parameters do not need repeating.
    "&reset_hold":
      tap: $$mdi:restart$$
      hold: 1s
    "&boot_hold":
      tap: $$mdi:usb-flash-drive-outline$$
      hold: 1s
    # Nav layer clipboard keys. Shown by intent rather than as "Ctl+C" etc, which
    # renders as five near-identical strings. Note these stay as modifier chords
    # in the keymap on purpose: ZMK's dedicated K_COPY / C_AC_COPY usages are
    # marked unsupported on Windows in ZMK's own hid.js compatibility data.
    "&kp LC(Z)": $$mdi:undo$$
    "&kp LC(Y)": $$mdi:redo$$
    "&kp LC(X)": $$mdi:content-cut$$
    "&kp LC(C)": $$mdi:content-copy$$
    "&kp LC(V)": $$mdi:content-paste$$
    # Nav layer, left hand: OS navigation. Shown by intent, since the default
    # rendering would be "Gui+" plus the arrow glyph, which reads as a cursor key.
    "&kp LG(LEFT)": $$mdi:dock-left$$
    "&kp LG(RIGHT)": $$mdi:dock-right$$
    "&kp LG(UP)": $$mdi:window-maximize$$
    "&kp LG(DOWN)": $$mdi:window-minimize$$
    "&kp LA(TAB)": $$mdi:window-restore$$
    "&kp LG(TAB)": $$mdi:view-grid-outline$$
    "&kp LA(LEFT)": $$mdi:arrow-left-circle$$
    "&kp LA(RIGHT)": $$mdi:arrow-right-circle$$
    "&kp LG(LS(S))": $$mdi:monitor-screenshot$$
    # "OUT TOG" wrapped onto two cramped lines; the glyph reads as "switch
    # between the two outputs", with the tooltip naming them.
    "&out OUT_TOG": $$mdi:swap-horizontal$$
    # NOTE: deliberately no "&mo ..." entries here. A raw_binding_map hit returns
    # early from the parser, before the &mo branch that records which key was held
    # to reach a layer -- so mapping &mo here silently disables the "held" markers.
    # Use layer_legend_map below to style these instead.
    # Glyph as the main legend, profile number in the corner. These used to be
    # drawn as combos, where the box is small enough that the number had to be
    # the primary legend; as full keys on the Media layer there is room for the
    # icon to carry the meaning.
    "&bt BT_SEL 0":
      tap: $$mdi:bluetooth-connect$$
      shifted: "1"
      type: bluetooth
    "&bt BT_SEL 1":
      tap: $$mdi:bluetooth-connect$$
      shifted: "2"
      type: bluetooth
    "&bt BT_SEL 2":
      tap: $$mdi:bluetooth-connect$$
      shifted: "3"
      type: bluetooth
    "&bt BT_SEL 3":
      tap: $$mdi:bluetooth-connect$$
      shifted: "4"
      type: bluetooth
    "&bt BT_SEL 4":
      tap: $$mdi:bluetooth-connect$$
      shifted: "5"
      type: bluetooth

  sticky_label: sticky
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  trans_legend:
    t: ▽
    type: trans
  # Legend used when a layer is *referenced* by &mo/&to/&tog. Keyed on the layer's
  # display-name. This keeps the arrow glyphs on the thumb keys while letting the
  # parser mark those keys as held on the layer they activate.
  layer_legend_map: {}
    # Nav: $$material:arrow_circle_down$$
    # Num: $$material:arrow_circle_up$$
  zmk_remove_keycode_prefix: []
  zmk_keycode_map:
    # Symbols
    EXCLAMATION: "!"
    EXCL: "!"
    AT_SIGN: "@"
    AT: "@"
    HASH: "#"
    POUND: "#"
    DOLLAR: $
    DLLR: $
    PERCENT: "%"
    PRCNT: "%"
    CARET: ^
    AMPERSAND: "&"
    AMPS: "&"
    ASTERISK: "*"
    ASTRK: "*"
    STAR: "*"
    KP_MULTIPLY: $$mdi:asterisk$$
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL:
      tap: "="
      shifted: "+"
    PLUS: +
    MINUS:
      tap: "-"
      shifted: "_"
    UNDERSCORE: _
    UNDER: _
    SLASH:
      tap: "/"
      shifted: "?"
    FSLH:
      tap: "/"
      shifted: "?"
    QUESTION: "?"
    QMARK: "?"
    BACKSLASH:
      tap: '\'
      shifted: "|"
    BSLH:
      tap: '\'
      shifted: "|"
    PIPE: "|"
    NON_US_BACKSLASH: \
    PIPE2: "|"
    NON_US_BSLH: "|"
    SEMICOLON:
      tap: ";"
      shifted: ":"
    SEMI:
      tap: ";"
      shifted: ":"
    COLON: ":"
    SINGLE_QUOTE:
      tap: "'"
      shifted: '"'
    SQT:
      tap: "'"
      shifted: '"'
    APOSTROPHE: <
    APOS: .
    DOUBLE_QUOTES: '"'
    DQT: '"'

    LESS_THAN: <
    LT: <
    DOT:
      tap: $$mdi:circle-small$$
      shifted: ">"
    COMMA:
      tap: $$mdi:comma$$
      shifted: "<"
    GREATER_THAN: ">"
    GT: ">"
    LEFT_BRACKET:
      tap: "["
      shifted: "{"
    LBKT:
      tap: "["
      shifted: "{"
    LEFT_BRACE: "{"
    LBRC: "{"
    RIGHT_BRACKET:
      tap: "]"
      shifted: "}"
    RBKT:
      tap: "]"
      shifted: "}"
    RIGHT_BRACE: "}"
    RBRC: "}"
    GRAVE:
      tap: $$material:code$$
      shifted: "~"
    TILDE: "~"
    NON_US_HASH: "#"
    NUHS: "#"
    TILDE2: "~"

    # Numbers
    N1:
      tap: 1
      shifted: "!"
    N2:
      tap: 2
      shifted: "@"
    N3:
      tap: 3
      shifted: "#"
    N4:
      tap: 4
      shifted: "$"
    N5:
      tap: 5
      shifted: "%"
    N6:
      tap: 6
      shifted: "^"
    N7:
      tap: 7
      shifted: "&"
    N8:
      tap: 8
      shifted: "*"
    N9:
      tap: 9
      shifted: "("
    N0:
      tap: 0
      shifted: ")"

    # Modifiers
    LCTRL: $$mdi:apple-keyboard-control$$
    LALT: $$mdi:apple-keyboard-option$$
    LSHIFT: $$mdi:apple-keyboard-shift$$
    LSHFT: $$mdi:apple-keyboard-shift$$
    LGUI: $$mdi:apple-keyboard-command$$
    RCTRL: $$mdi:apple-keyboard-control$$
    RALT: $$mdi:apple-keyboard-option$$
    RSHIFT: $$mdi:apple-keyboard-shift$$
    RSHFT: $$mdi:apple-keyboard-shift$$
    RGUI: $$mdi:apple-keyboard-command$$
    LS(LC(LALT)): $$mdi:triangle$$ # Meh

    # Arrows
    UP: $$mdi:arrow-up-thin$$
    DOWN: $$mdi:arrow-down-thin$$
    LEFT: $$mdi:arrow-left-thin$$
    RIGHT: $$mdi:arrow-right-thin$$
    PG_UP: $$mdi:transfer-up$$
    PG_DN: $$mdi:transfer-down$$
    HOME: $$mdi:arrow-collapse-left$$
    END: $$mdi:arrow-collapse-right$$

    # Whitespace
    RET:
      type: enter
      tap: $$mdi:keyboard-return$$
    ESC: $$mdi:keyboard-esc$$
    TAB: $$mdi:keyboard-tab$$
    LS(TAB): $$mdi:keyboard-tab-reverse$$
    SPACE: $$mdi:keyboard-space$$
    BACKSPACE:
      type: backspace
      tap: $$mdi:backspace$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace$$
    DELETE: $$mdi:backspace-reverse-outline$$
    DEL: $$mdi:backspace-reverse-outline$$
    # No icon for Insert: mdi:cursor-text renders as a bare I-beam that reads as
    # the letter I, and nothing else in the set says "overtype". The three-letter
    # label is the clearest option, and the tooltip carries the detail.

    # Locks
    CAPSLOCK: $$mdi:apple-keyboard-caps$$
    CAPS: $$mdi:apple-keyboard-caps$$

    # Sound
    C_MUTE: $$mdi:volume-off$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-low$$

    # Media
    C_NEXT: $$mdi:skip-next$$
    C_PREV: $$mdi:skip-previous$$
    C_PLAY_PAUSE: $$mdi:play-pause$$
    C_RW: $$mdi:rewind$$
    C_FF: $$mdi:fast-forward$$

    # Bluetooth
    BT_CLR: $$mdi:bluetooth-off$$
    BT_SEL: $$mdi:bluetooth-connect$$

    # Settings
    C_BRI_UP: $$mdi:brightness-5$$
    C_BRI_DN: $$mdi:brightness-7$$

    # System
    C_POWER: $$mdi:power-standby$$
    C_AL_LOCK: $$mdi:lock$$
    K_CANCEL: $$mdi:close-box$$
    PRINTSCREEN: $$mdi:monitor-screenshot$$
    PSCRN: $$mdi:monitor-screenshot$$
    K_APP: $$mdi:menu$$

    # Zoom
    RG(RS(A)):
      tap: $$mdi:microphone$$
      hold: zoom
    RG(RS(V)):
      tap: $$mdi:video$$
      hold: zoom
