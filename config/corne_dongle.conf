# Prospector dongle, applied on top of config/corne.conf: ZMK trims the shield
# name to `corne` and picks that file up too, so the dongle inherits the radio
# power, sleep and Studio settings, and this file overrides what must differ.
#
# There is no corne_dongle.keymap for the same reason -- the keymap search hits
# config/corne.keymap first, so the dongle runs the shared keymap unmodified.

# Overrides corne.conf's "Corne" so the two are distinguishable in Studio and in
# the host's Bluetooth list. This cannot live in the shield's Kconfig.defconfig:
# a Kconfig `default` loses to a .conf assignment. Max 16 characters.
CONFIG_ZMK_KEYBOARD_NAME="Corne Dongle"

# The keymap runs on the central, so the Mouse layer's &mkp needs pointing
# support here rather than on the halves (see config/corne_left.conf).
CONFIG_ZMK_POINTING=y

# Prospector display. The adapter shield already turns on CONFIG_ZMK_DISPLAY and
# the peripheral battery fetching that the on-screen battery bars read.
#
# This dongle has no ambient light sensor fitted, so auto-brightness is off and
# the display runs at a fixed level. The adapter shield declares an APDS9960
# node regardless and defaults the sensor on, hence the explicit n.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Re-broadcast the halves' battery levels to the host over an extra Battery
# Level service. Does nothing while the dongle is on USB; it is here so the
# levels still reach a host that the dongle talks to over Bluetooth instead.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
