<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keymap &middot; tster.nl</title>
  <meta name="description" content="ZMK keymap diagram for a Corne and a Toucan2, sharing a single keymap.">
  <meta name="color-scheme" content="dark">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%E2%8C%A8</text></svg>">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --fg: #c9d1d9;
      --muted: #8b949e;
      --link: #58a6ff;
      --rule: #21262d;
      /* 840px (the SVG's natural width) + the 2x20px padding applied at the
         desktop breakpoint, so the diagram lands at exactly 1:1 on wide screens
         rather than being squeezed by the padding. */
      --max: 880px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    main {
      flex: 1 0 auto;
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      /* Half the desktop padding: enough to keep the diagram off the screen
         edges without wasting width on a phone. */
      padding: 16px 10px 0;
    }

    /* The SVG is 840x1433, so width:100% keeps it readable on a phone and the
       page simply scrolls. */
    .keymap {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }

    footer {
      flex-shrink: 0;
      border-top: 1px solid var(--rule);
      margin-top: 32px;
      padding: 20px 16px 28px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
    }

    footer a:hover,
    footer a:focus-visible {
      text-decoration: underline;
    }

    /* Breathing room only once there is room to spare. */
    @media (min-width: 880px) {
      main {
        padding: 32px 20px 0;
      }
    }
  </style>
</head>

<body>
  <main>
    <!-- src points at the diagram on GitHub so that opening this file directly
         in a browser previews correctly. scripts/build-site.sh rewrites it to a
         content-hashed local copy, which is what actually gets deployed.

         width/height are the SVG's intrinsic size: gives the browser the aspect
         ratio up front so nothing reflows once the image loads. -->
    <img class="keymap"
      src="https://raw.githubusercontent.com/sterrenb/zmk-config/main/keymap-drawer/corne.svg" width="840" height="1433"
      alt="Keymap diagram: base, lower, raise, adjust and mouse layers for a 42-key split keyboard.">
  </main>

  <footer>
    <a href="https://github.com/sterrenb/zmk-config">sterrenb/zmk-config</a>
  </footer>
</body>

</html>
