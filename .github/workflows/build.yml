name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      # config/** rather than config/*.dtsi: a `*` glob does not cross `/`, so
      # config/shared/*.dtsi would not match. The release flow depends on this —
      # prepare-release.yml stamps config/shared/version.dtsi, and if that push
      # does not trigger a build there is no firmware artifact and no release.
      - "config/**"
      - "boards/**"
      - "build.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || github.ref != 'refs/heads/main'))
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
