name: Finalize Release

on:
  workflow_run:
    workflows: ["Build ZMK firmware"]
    types:
      - completed
    branches:
      - "release/*"

jobs:
  release:
    name: Create GitHub Release and PR
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Extract version from branch name
        id: extract_version
        run: |
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          VERSION=${BRANCH_NAME#release/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download firmware artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v24
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          path: firmware-artifact
          name: firmware
          skip_unpack: true

      - name: Rename firmware artifact
        run: |
          mv firmware-artifact/firmware.zip firmware-artifact/firmware-${{ steps.extract_version.outputs.version }}.zip
          echo "Renamed artifact to firmware-${{ steps.extract_version.outputs.version }}.zip"

      - name: Download keymap diagram artifact
        uses: dawidd6/action-download-artifact@v24
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          path: keymap-artifact
          name: keymap-diagram

      - name: Rename keymap diagram
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          # Renamed rather than left as corne.svg: it is attached to the release
          # as "keymap-", not "corne-", one diagram covering both keyboards (see
          # the comment in draw-keymaps.yml).
          #
          # No version-label check needed here, unlike the git-fetched copy this
          # replaced: build.yml's draw job parses config/corne.keymap from the
          # exact commit it just built, which is the commit prepare-release.yml
          # already stamped -- there is no separate, independently-triggered
          # redraw for this to race against.
          mv keymap-artifact/corne.svg keymap-artifact/keymap-$VERSION.svg
          echo "Renamed diagram to keymap-$VERSION.svg"

      - name: Render keymap diagram to PNG
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          SVG="$PWD/keymap-artifact/keymap-$VERSION.svg"
          PNG="$PWD/keymap-artifact/keymap-$VERSION.png"

          # Checked here rather than after the fact: a navigation failure does not
          # fail Chrome, it screenshots the "file couldn't be accessed" page, and
          # that PNG is the right size and a plausible weight. Absolute paths for
          # the same reason -- a relative --screenshot target is resolved against
          # Chrome's own working directory, not this step's.
          if [ ! -s "$SVG" ]; then
            echo "no keymap diagram at $SVG" >&2
            exit 1
          fi

          # Read the size off the diagram rather than hard-coding it, so a layer
          # added later grows the PNG instead of being cropped out of it.
          DIMS=$(sed -n '1s/.*width="\([0-9]\{1,\}\)".*height="\([0-9]\{1,\}\)".*/\1 \2/p' "$SVG")
          if [ -z "$DIMS" ]; then
            echo "could not read width/height from $SVG" >&2
            exit 1
          fi

          # keymap-drawer has no PNG output of its own and its README points at
          # CairoSVG or Inkscape, but the SVG-native renderers do not implement
          # the CSS this diagram leans on. keymap-drawer.config.yml styles it with
          # custom properties and the `translate:` property; librsvg resolves
          # var() only for paint colours and only with a fallback, and resvg
          # covers the static SVG subset. Rendered through resvg the accent keys
          # come out black and the home row modifier glyphs land on top of the
          # letters -- silently, exit code 0. Chrome is the engine the published
          # site renders with, and its .deb depends on fonts-liberation, so the
          # monospace legends resolve the same way here as they do locally.
          #
          # --default-background-color is what makes this the light themed PNG.
          # The SVG carries no background of its own (it inherits the page's), so
          # without this it renders transparent and its near-black legends are
          # unreadable on any dark backdrop.
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            echo "no Chrome on the runner to render $SVG with" >&2
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --user-data-dir="$(mktemp -d)" \
            --default-background-color=FFFFFFFF \
            --force-device-scale-factor=2 \
            --window-size="${DIMS// /,}" \
            --screenshot="$PNG" \
            "file://$SVG"

          if [ ! -s "$PNG" ]; then
            echo "rendering $SVG produced no PNG" >&2
            exit 1
          fi
          echo "rendered $PNG at 2x of ${DIMS// /x}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.extract_version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_branch }}
          name: ${{ steps.extract_version.outputs.version }}
          files: |
            firmware-artifact/firmware-${{ steps.extract_version.outputs.version }}.zip
            keymap-artifact/keymap-${{ steps.extract_version.outputs.version }}.svg
            keymap-artifact/keymap-${{ steps.extract_version.outputs.version }}.png
          generate_release_notes: true

      - name: Merge release branch to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff origin/${{ github.event.workflow_run.head_branch }} -m "chore(release): merge ${{ steps.extract_version.outputs.version }}"
          git push origin main
          git push origin --delete ${{ github.event.workflow_run.head_branch }} || true
