# https://github.com/caksoylar/keymap-drawer?tab=readme-ov-file#automated-drawing-workflow
name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      # Corne only: both keyboards share config/shared/keymap.dtsi and the same
      # key numbering, so one diagram documents both. Toucan-only changes must
      # not trigger a redraw that produces an empty commit.
      - "config/corne.keymap"
      - "config/shared/**"
      - "config/keymap-drawer.config.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    # Prevent workflow loops by skipping runs triggered by the action's own commits.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref != 'refs/heads/main' && (github.event.head_commit.author.name != 'github-actions[bot]' || startsWith(github.event.head_commit.message, 'chore(release):')))
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      # Corne only. Globbing config/*.keymap would also pick up
      # config/toucan.keymap, for which keymap-drawer has no physical layout.
      keymap_patterns: "config/corne.keymap"
      config_path: "config/keymap-drawer.config.yml"
      output_folder: "keymap-drawer"
      # Pinned so unrelated keymap-drawer releases cannot perturb corne.svg, and
      # so CI matches what scripts/draw.ps1 produces locally.
      install_version: "0.23.0"
      parse_args: ""
      draw_args: ""
      commit_message: "chore(draw): update keymaps"
