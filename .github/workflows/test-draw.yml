# Scratch workflow to test generating the keymap diagram as a job dependency
# (destination: artifact) instead of a committed file, for the release.yml
# race-fix under discussion. Delete this file once that approach is proven --
# it exists only to validate the mechanism in isolation, on this branch, with
# no effect on build.yml, draw-keymaps.yml, prepare-release.yml or release.yml.
name: Test draw
on:
  push:
    branches: [fix/dongle-matrix]
  # Only dispatchable once this file has run at least once via the push
  # trigger above -- a brand new workflow_dispatch trigger isn't recognized by
  # GitHub until the workflow exists on the default branch or has already run.
  workflow_dispatch:

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    with:
      keymap_patterns: "config/corne.keymap"
      config_path: "config/keymap-drawer.config.yml"
      output_folder: "keymap-drawer"
      install_version: "0.23.0"
      destination: artifact
      artifact_name: test-diagram
